<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* 🌌 APPLE STYLE BACKGROUND */

body{
margin:0;
font-family:-apple-system, BlinkMacSystemFont, sans-serif;
background:linear-gradient(to top,#1c1c1e,#3a3a3c,#636366);
color:white;
}

/* GLASS EFFECT */
.glass{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);
border-radius:20px;
padding:20px;
}

/* CONTAINER */
.container{
max-width:420px;
margin:auto;
padding:20px;
}

/* HEADER */
.header{
text-align:center;
margin-bottom:20px;
}

.city{
font-size:22px;
opacity:0.8;
}

.temp{
font-size:72px;
font-weight:300;
}

.condition{
font-size:20px;
opacity:0.9;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.card{
text-align:center;
}

/* CHART */
.chart{
margin-top:20px;
height:250px;
}

/* STATUS */
.status{
text-align:center;
margin-top:10px;
font-size:14px;
opacity:0.7;
}

.alert{
margin-top:10px;
padding:10px;
border-radius:12px;
font-size:14px;
display:none;
}

.alert-danger{background:#ff453a}
.alert-warning{background:#ff9f0a}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div class="city">📍 Weather Station</div>
<div class="temp" id="temp">--°</div>
<div class="condition" id="condition">Loading...</div>
</div>

<div class="glass grid">

<div class="card">
<div>Humidity</div>
<div id="hum">--</div>
</div>

<div class="card">
<div>Wind</div>
<div id="wind">--</div>
</div>

<div class="card">
<div>Visibility</div>
<div id="vis">--</div>
</div>

<div class="card">
<div>Rain</div>
<div id="rain">--</div>
</div>

</div>

<div class="glass chart">
<canvas id="chart"></canvas>
</div>

<div id="alertBox" class="alert"></div>

<div class="status" id="status">Updating...</div>

</div>

<script>

let chart;

/* SAFE VALUE */
function safe(val, unit=""){
if(val === null || val === undefined) return "--";
return Number(val).toFixed ? Number(val).toFixed(1)+unit : val+unit;
}

/* CONDITION */
function getCondition(temp,rain){

if(temp === null || temp === undefined) return "Loading...";

if(rain && rain !== "No Rain") return "🌧 Rainy";
if(temp > 35) return "☀ Hot";
if(temp < 15) return "❄ Cold";
return "☁ Cloudy";
}

/* FETCH DATA */
async function fetchData(){

try{

const res = await fetch("/api/latest");

if(!res.ok){
document.getElementById("status").innerText="Server Error";
return;
}

const data = await res.json();

/* DEVICE STATUS */
if(data.device_status && data.device_status !== "Online"){
document.getElementById("status").innerText="🔴 Device Offline";
return;
}

/* MAIN DATA */

document.getElementById("temp").innerText = safe(data.temperature,"°C");
document.getElementById("hum").innerText = safe(data.humidity,"%");
document.getElementById("wind").innerText = safe(data.wind_speed," km/h");
document.getElementById("vis").innerText = safe(data.visibility,"%");
document.getElementById("rain").innerText = data.rain || "--";

/* CONDITION */
document.getElementById("condition").innerText =
getCondition(data.temperature,data.rain);

/* STATUS */
document.getElementById("status").innerText="🟢 Live";

/* ALERT */
const alertBox=document.getElementById("alertBox");

if(data.alert && data.alert !== "Normal"){
alertBox.style.display="block";
alertBox.className="alert "+(data.alert.includes("Storm")?"alert-danger":"alert-warning");
alertBox.innerText="⚠ "+data.alert;
}else{
alertBox.style.display="none";
}

}catch(e){
document.getElementById("status").innerText="🔴 Network Error";
}

}

/* CHART */
async function loadChart(){

try{

const res = await fetch("/api/history");

if(!res.ok) return;

const data = await res.json();

if(!data || data.length === 0) return;

const temps = data.map(d=>d.temperature ?? 0);

const labels = data.map(d=>{
const t = new Date(d.time);
return t.getHours().toString().padStart(2,'0')+":00";
});

const ctx = document.getElementById("chart");

if(chart) chart.destroy();

chart = new Chart(ctx,{
type:"line",
data:{
labels:labels,
datasets:[{
data:temps,
borderColor:"#0a84ff",
backgroundColor:"rgba(10,132,255,0.2)",
fill:true,
tension:0.4
}]
},
options:{
plugins:{legend:{display:false}},
scales:{x:{display:false},y:{display:false}}
}
});

}catch(e){
console.log("Chart error");
}

}

/* RUN */
fetchData();
loadChart();
setInterval(fetchData,8000);

</script>

</body>
</html>
