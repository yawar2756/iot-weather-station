<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="description" content="Live IoT weather dashboard showing real-time temperature, humidity, wind speed and rainfall data.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Weather Dashboard | IoT Weather Station</title>
<meta name="description" content="Real-time dashboard showing temperature, humidity, wind and rainfall data from IoT sensors.">
<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
overflow-x:hidden;
}

.header{
background:rgba(0,0,0,0.4);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.header h1{margin:0;font-size:22px}

.export-btn{
background:#28a745;
padding:8px 14px;
border-radius:6px;
color:white;
text-decoration:none;
font-size:13px;
}

.container{
width:100%;
padding:20px;
box-sizing:border-box;
}

.hero{text-align:center;margin-bottom:30px}
.temperature{font-size:72px;font-weight:700}
.trend{font-size:18px;margin-top:5px}
.status{margin-top:10px;font-weight:bold}
.update-time{margin-top:6px;font-size:13px;opacity:0.7}

.grid{display:grid;gap:20px}

.kpi-grid{
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
margin-bottom:30px;
}

.analytics-grid{
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
text-align:center;
}

.chart-section{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
height:320px;
}

.alert{
display:none;
margin-top:15px;
padding:14px;
border-radius:12px;
font-weight:bold;
}

.alert-danger{background:#cc0000}
.alert-warning{background:#ff8000}

@media(max-width:768px){
.temperature{font-size:46px}
.kpi-grid,.analytics-grid{grid-template-columns:1fr}
.chart-section{height:260px}
}
</style></head><body><div class="header">
<div>
<h1>GPCA Smart Weather System</h1>
<span>Cloud Monitoring Dashboard • v1.0.0</span>
</div>
<a href="/api/export" class="export-btn">⬇ Export Last 7 Days</a>
</div><div class="container"><div class="hero">
<div class="temperature" id="temp">-- °C</div>
<div class="trend" id="trend">➖ Stable</div>
<div id="deviceStatus" class="status">⏳ Loading data...</div>
<div class="update-time" id="updateTime">Updated --</div>
<div id="liveClock"></div>
<div id="alertBox" class="alert"></div>
</div><div class="grid kpi-grid">
<div class="card"><h3>Humidity</h3><p id="hum">-- %</p></div>
<div class="card"><h3>Wind Speed</h3><p id="windSpeed">-- km/h</p></div>
<div class="card"><h3>Visibility</h3><p id="visibility">-- %</p></div>
<div class="card"><h3>Rain Status</h3><p id="rain">--</p></div>
</div><div class="grid analytics-grid">
<div class="card"><h3>Min Temperature</h3><p id="minTemp">-- °C</p></div>
<div class="card"><h3>Max Temperature</h3><p id="maxTemp">-- °C</p></div>
<div class="card"><h3>Average Temperature</h3><p id="avgTemp">-- °C</p></div>
</div><div class="chart-section">
<label>📅 View Mode:</label>
<select id="chartMode" onchange="loadChart()">
<option value="hourly">Last 12 Hours</option>
<option value="daily">Last 7 Days</option>
</select>
<canvas id="tempChart"></canvas>
</div></div><script>

let chart=null;
let lastUpdateTime=null;
let clockTimer=null;

/* COUNTER */
function updateCounter(){
if(!lastUpdateTime)return;
const sec=Math.floor((Date.now()-lastUpdateTime)/1000);
document.getElementById("updateTime").innerText="Updated "+sec+"s ago";
}
setInterval(updateCounter,1000);

/* FETCH */
async function fetchData(){
try{
const res=await fetch("/api/latest");

if(!res.ok){
document.getElementById("deviceStatus").innerText="🔴 Offline";
return;
}

const data=await res.json();

if(data.message){
document.getElementById("deviceStatus").innerText="⚠ No Data Yet";
return;
}

document.getElementById("deviceStatus").innerText =
data.device_status==="Online"?"🟢 Device Online":"🔴 Offline";

lastUpdateTime=Date.now();

document.getElementById("temp").innerText=data.temperature!=null?Number(data.temperature).toFixed(1)+" °C":"-- °C";
document.getElementById("hum").innerText=data.humidity!=null?Number(data.humidity).toFixed(0)+" %":"-- %";
document.getElementById("windSpeed").innerText=data.wind_speed!=null?Number(data.wind_speed).toFixed(1)+" km/h":"-- km/h";
document.getElementById("visibility").innerText=data.visibility!=null?Number(data.visibility).toFixed(0)+" %":"-- %";
document.getElementById("rain").innerText=data.rain??"--";

document.getElementById("minTemp").innerText=data.min_temp!=null?Number(data.min_temp).toFixed(1)+" °C":"-- °C";
document.getElementById("maxTemp").innerText=data.max_temp!=null?Number(data.max_temp).toFixed(1)+" °C":"-- °C";
document.getElementById("avgTemp").innerText=data.avg_temp!=null?Number(data.avg_temp).toFixed(1)+" °C":"-- °C";

document.getElementById("trend").innerText=
data.trend==="Rising"?"📈 Rising":
data.trend==="Falling"?"📉 Falling":"➖ Stable";

const alertBox=document.getElementById("alertBox");

if(data.alert && data.alert!=="Normal"){
alertBox.style.display="block";
alertBox.className="alert "+(data.alert.includes("Storm")||data.alert.includes("Heat")?"alert-danger":"alert-warning");
alertBox.innerText="⚠ "+data.alert;
}else{
alertBox.style.display="none";
}

}catch(e){
console.log("fetch error:",e);
document.getElementById("deviceStatus").innerText="🔴 Offline";
}
}

/* CHART */
async function loadChart(){
try{
const mode=document.getElementById("chartMode").value;

const res=await fetch("/api/history?mode="+mode);
if(!res.ok)return;

const data=await res.json();
if(!data || data.length===0)return;

const temps=data.map(d=>d.temperature??0);

const times=data.map(d=>{
const date=new Date(d.time);
return mode==="hourly"
?date.getHours().toString().padStart(2,'0')+":00"
:date.toLocaleDateString();
});

const ctx=document.getElementById("tempChart").getContext("2d");

/* UPDATE */
if(chart){
chart.data.labels=times;
chart.data.datasets[0].data=temps;
chart.update();
return;
}

/* CREATE */
const gradient=ctx.createLinearGradient(0,0,0,300);
gradient.addColorStop(0,"rgba(0,229,255,0.45)");
gradient.addColorStop(1,"rgba(0,229,255,0.02)");

chart=new Chart(ctx,{
type:"line",
data:{
labels:times,
datasets:[{
label:"Temperature (°C)",
data:temps,
borderColor:"#00e5ff",
backgroundColor:gradient,
fill:true,
tension:0.4,
pointRadius:2,
borderWidth:3
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
scales:{
x:{ticks:{color:"#00e5ff"},grid:{color:"rgba(255,255,255,0.15)"}},
y:{ticks:{color:"#ffffff"},grid:{color:"rgba(255,255,255,0.1)"}}
}
}
});

}catch(e){
console.log("chart error:",e);
}
}

/* CLOCK */
function liveClock(){
document.getElementById("liveClock").innerText="🕒 "+new Date().toLocaleTimeString();
}

function startClock(){
liveClock();
if(clockTimer)clearInterval(clockTimer);
clockTimer=setInterval(liveClock,1000);
}

/* INIT */
window.addEventListener("load",()=>{
fetchData();
loadChart();
startClock();
});

/* AUTO REFRESH */
setInterval(()=>{if(!document.hidden)fetchData();},10000);
setInterval(()=>{if(!document.hidden)loadChart();},15000);

</script></body>
</html>
