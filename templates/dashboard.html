<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPCA Smart Weather System</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

.header{
background:rgba(0,0,0,0.4);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.export-btn{
background:#28a745;
padding:8px 14px;
border-radius:6px;
color:white;
text-decoration:none;
}

.container{padding:20px}

.hero{text-align:center;margin-bottom:20px}
.temperature{font-size:60px;font-weight:700}

.grid{display:grid;gap:15px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.card{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:12px;
text-align:center;
}

.chart-section{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:12px;
height:300px;
}

select{
margin-bottom:10px;
padding:5px;
border-radius:5px;
}
</style></head><body><div class="header">
<h2>GPCA Weather Dashboard</h2>
<a href="/api/export" class="export-btn">⬇ Export</a>
</div><div class="container"><div class="hero">
<div id="temp" class="temperature">-- °C</div>
<div id="deviceStatus">Loading...</div>
</div><div class="grid kpi-grid">
<div class="card">Humidity<br><span id="hum">--</span></div>
<div class="card">Wind Speed<br><span id="wind">--</span></div>
<div class="card">Visibility<br><span id="vis">--</span></div>
<div class="card">Rain<br><span id="rain">--</span></div>
</div><div class="chart-section">
<select id="chartMode" onchange="loadChart()">
<option value="hourly">Last 12 Hours</option>
<option value="daily">Last 7 Days</option>
</select>
<canvas id="tempChart"></canvas>
</div></div><script>

let chart=null;

/* ===== LIVE DATA ===== */
async function fetchData(){
try{
const res=await fetch("/api/latest");

if(!res.ok){
document.getElementById("deviceStatus").innerText="🔴 Offline";
return;
}

const d=await res.json();

if(d.message){
document.getElementById("deviceStatus").innerText="⚠ No Data";
return;
}

document.getElementById("deviceStatus").innerText=
d.device_status==="Online"?"🟢 Online":"🔴 Offline";

document.getElementById("temp").innerText=
d.temperature!=null?d.temperature.toFixed(1)+" °C":"--";

document.getElementById("hum").innerText=
d.humidity!=null?d.humidity+" %":"--";

document.getElementById("wind").innerText=
d.wind_speed!=null?d.wind_speed+" km/h":"--";

document.getElementById("vis").innerText=
d.visibility!=null?d.visibility+" %":"--";

document.getElementById("rain").innerText=d.rain??"--";

}catch(e){
console.log("fetch error:",e);
document.getElementById("deviceStatus").innerText="🔴 Offline";
}
}

/* ===== CHART ===== */
async function loadChart(){
try{

const mode=document.getElementById("chartMode").value;

const res=await fetch("/api/history?mode="+mode);
if(!res.ok) return;

const data=await res.json();
if(!data || data.length===0) return;

const temps=data.map(d=>d.temperature??0);

const times=data.map(d=>{
const date=new Date(d.time);
return mode==="hourly"
? date.getHours().toString().padStart(2,'0') + ":00"
: date.toLocaleDateString();
});

const ctx=document.getElementById("tempChart").getContext("2d");

/* UPDATE WITHOUT RELOAD */
if(chart){
chart.data.labels=times;
chart.data.datasets[0].data=temps;
chart.update();
return;
}

/* CREATE FIRST TIME */
const gradient = ctx.createLinearGradient(0,0,0,300);
gradient.addColorStop(0,"rgba(0,229,255,0.45)");
gradient.addColorStop(1,"rgba(0,229,255,0.02)");

chart=new Chart(ctx,{
type:"line",
data:{
labels:times,
datasets:[{
label:"Temperature (°C)",
data:temps,
borderColor:"#00e5ff",
backgroundColor:gradient,
fill:true,
tension:0.4,
pointRadius:2,
borderWidth:3
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
scales:{
x:{
ticks:{color:"#00e5ff"},
grid:{color:"rgba(255,255,255,0.15)"}
},
y:{
ticks:{color:"#ffffff"},
grid:{color:"rgba(255,255,255,0.1)"}
}
}
}
});

}catch(e){
console.log("chart error:",e);
}
}

/* ===== INIT ===== */
window.onload=()=>{
fetchData();
loadChart();
};

/* AUTO REFRESH */
setInterval(()=>{
if(!document.hidden){
fetchData();
}
},10000);

setInterval(()=>{
if(!document.hidden){
loadChart();
}
},15000);

</script></body>
</html>
