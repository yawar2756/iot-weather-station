<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Weather Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
}

:root {
  --bg-primary: #0a0a0f;
  --glass: rgba(255,255,255,0.08);
  --glass-hover: rgba(255,255,255,0.12);
  --border-glass: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: rgba(255,255,255,0.7);
  --accent: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --shadow-sm: 0 10px 30px rgba(0,0,0,0.3);
  --shadow-md: 0 20px 60px rgba(0,0,0,0.4);
  --shadow-lg: 0 30px 100px rgba(0,0,0,0.5);
}

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
}

/* PREMIUM SKY */
#sky {
  position: fixed;
  inset: 0;
  z-index: 1;
  transition: all 1.8s cubic-bezier(0.23,1,0.32,1);
}

.sky-clear { 
  background: 
    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(116,185,255,0.4) 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 80% 10%, rgba(255,255,255,0.2) 0%, transparent 50%),
    linear-gradient(145deg, #1e3a8a 0%, #3b82f6 30%, #60a5fa 70%, #93c5fd 100%);
}

.sky-rain { 
  background: 
    radial-gradient(ellipse 50% 40% at 30% 70%, rgba(59,130,246,0.3) 0%, transparent 50%),
    linear-gradient(145deg, #1e293b 0%, #334155 40%, #475569 80%, #64748b 100%);
}

.sky-storm { 
  background: 
    linear-gradient(145deg, #0f172a 0%, #1e1b4b 40%, #312e81 80%, #1e1b4b 100%);
}

.sky-fog { 
  background: 
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, transparent 70%),
    linear-gradient(145deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
}

/* EFFECTS */
#rain { 
  position: fixed; 
  inset: 0; 
  z-index: 15; 
  pointer-events: none; 
}

.raindrop {
  position: absolute;
  width: 1px;
  height: 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.9), transparent);
  border-radius: 50% 10% 50% 10%;
  animation: rainFall linear infinite;
  box-shadow: 0 0 5px rgba(255,255,255,0.3);
}

@keyframes rainFall {
  0% { transform: translateY(-100vh) translateX(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(100vh) translateX(-20px); opacity: 0; }
}

#fog { 
  position: fixed; 
  inset: 0; 
  z-index: 12; 
  pointer-events: none;
  background: 
    radial-gradient(circle 300px at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 70%),
    radial-gradient(circle 200px at 80% 30%, rgba(255,255,255,0.06) 0%, transparent 70%);
  opacity: 0;
  transition: all 1.5s ease;
  backdrop-filter: blur(1px);
}

#lightning {
  position: fixed;
  inset: 0;
  z-index: 25;
  background: 
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.95) 0%, transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(255,255,255,0.8) 0%, transparent 40%);
  opacity: 0;
  transition: opacity 0.08s ease;
}

/* HEADER - PREMIUM */
.header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(10,10,15,0.95);
  backdrop-filter: blur(40px);
  padding: 24px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-glass);
  box-shadow: var(--shadow-sm);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo h1 {
  font-size: 28px;
  font-weight: 800;
  background: var(--accent);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 0;
  letter-spacing: -0.5px;
}

.version {
  font-size: 13px;
  opacity: 0.6;
  font-weight: 500;
}

.premium-btn {
  background: var(--accent);
  color: white;
  padding: 14px 28px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  box-shadow: var(--shadow-md);
  transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
  border: none;
  position: relative;
  overflow: hidden;
}

.premium-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.6s;
}

.premium-btn:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: var(--shadow-lg);
}

.premium-btn:hover::before { left: 100%; }

/* MAIN CONTENT */
.container {
  position: relative;
  z-index: 100;
  max-width: 1400px;
  margin: 0 auto;
  padding: 60px 40px 40px;
}

/* HERO - ULTRA PREMIUM */
.hero {
  background: var(--glass);
  backdrop-filter: blur(50px);
  border: 1px solid var(--border-glass);
  border-radius: 32px;
  padding: 80px 60px;
  text-align: center;
  margin-bottom: 60px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
}

.temp-display {
  font-size: 120px;
  font-weight: 900;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--text-primary) 0%, rgba(255,255,255,0.8) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -3px;
  line-height: 1;
  position: relative;
}

.temp-display::after {
  content: '';
  position: absolute;
  bottom: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
}

.trend {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 24px;
  opacity: 0.95;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  padding: 16px 32px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border-radius: 50px;
  border: 1px solid var(--border-glass);
  margin: 20px 0;
}

.live-clock {
  font-size: 24px;
  font-weight: 700;
  margin-top: 30px;
  opacity: 0.9;
}

.update-info {
  font-size: 14px;
  opacity: 0.7;
  margin-top: 12px;
  font-weight: 500;
}

/* KPI CARDS - PREMIUM */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 30px;
  margin-bottom: 60px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
  margin-bottom: 60px;
}

.metric-card {
  background: var(--glass);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-glass);
  border-radius: 24px;
  padding: 40px 32px;
  text-align: center;
  transition: all 0.4s cubic-bezier(0.23,1,0.32,1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.metric-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
}

.metric-card:hover {
  transform: translateY(-12px) scale(1.02);
  background: var(--glass-hover);
  border-color: rgba(255,255,255,0.25);
  box-shadow: var(--shadow-lg);
}

.metric-label {
  font-size: 14px;
  font-weight: 600;
  opacity: 0.8;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.metric-value {
  font-size: 42px;
  font-weight: 900;
  margin: 0;
  line-height: 1;
}

/* CHART - PREMIUM */
.chart-container {
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(40px);
  border: 1px solid var(--border-glass);
  border-radius: 28px;
  padding: 45px;
  height: 420px;
  box-shadow: var(--shadow-lg);
}

.chart-header {
  position: absolute;
  top: 30px;
  left: 45px;
  right: 45px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.chart-date {
  font-size: 16px;
  font-weight: 700;
}

.chart-selector {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-glass);
  border-radius: 20px;
  padding: 12px 24px;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.chart-selector:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.05);
}

canvas {
  border-radius: 20px;
  height: 100% !important;
  width: 100% !important;
}

/* ALERTS - PREMIUM */
.alert {
  display: none;
  margin-top: 30px;
  padding: 24px 40px;
  border-radius: 24px;
  font-weight: 700;
  font-size: 16px;
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-glass);
  animation: alertSlide 0.5s cubic-bezier(0.23,1,0.32,1);
  box-shadow: var(--shadow-md);
  text-align: center;
}

.alert-danger {
  background: rgba(239,68,68,0.2);
  border-color: rgba(239,68,68,0.4);
}

.alert-warning {
  background: rgba(251,191,36,0.2);
  border-color: rgba(251,191,36,0.4);
}

@keyframes alertSlide {
  from { 
    opacity: 0; 
    transform: translateY(20px) scale(0.95); 
  }
  to { 
    opacity: 1; 
    transform: translateY(0) scale(1); 
  }
}

.loading-text {
  opacity: 0.7;
  font-size: 16px;
  font-weight: 600;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.9; }
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .metrics-grid, .stats-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}

@media (max-width: 768px) {
  .container { padding: 40px 20px 20px; }
  .hero { padding: 60px 30px; margin-bottom: 40px; }
  .temp-display { font-size: 85px; }
  .chart-container { height: 350px; padding: 30px; }
  .metrics-grid, .stats-grid { grid-template-columns: 1fr; gap: 20px; }
  .header { padding: 20px 24px; }
}
</style>
</head>

<body>
<div id="sky" class="sky-clear"></div>
<div id="rain"></div>
<div id="fog"></div>
<div id="lightning"></div>

<header class="header">
  <div class="logo">
    <h1>Weather Pro</h1>
    <span class="version">Premium v2.1</span>
  </div>
  <a href="/api/export" class="premium-btn">⬇ Export Data</a>
</header>

<main class="container">
  <section class="hero">
    <div class="temp-display" id="temp">--°C</div>
    <div class="trend" id="trend">➖ Stable</div>
    <div class="status-badge" id="status">⏳ Connecting...</div>
    <div class="loading-text" id="loadingText">Live weather data</div>
    <div class="update-info" id="updateTime"></div>
    <div class="live-clock" id="liveClock"></div>
    <div id="alertBox" class="alert"></div>
  </section>

  <section class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Humidity</div>
      <div class="metric-value" id="hum">--%</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Wind Speed</div>
      <div class="metric-value" id="windSpeed">-- km/h</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Visibility</div>
      <div class="metric-value" id="visibility">--%</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Precipitation</div>
      <div class="metric-value" id="rain">--</div>
    </div>
  </section>

  <section class="stats-grid">
    <div class="metric-card">
      <div class="metric-label">Min Temperature</div>
      <div class="metric-value" id="minTemp">--°C</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Max Temperature</div>
      <div class="metric-value" id="maxTemp">--°C</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Average</div>
      <div class="metric-value" id="avgTemp">--°C</div>
    </div>
  </section>

  <section class="chart-container">
    <div class="chart-header">
      <div class="chart-date" id="dateLabel">📊 Loading chart...</div>
      <select class="chart-selector" id="chartMode" onchange="loadChart()">
        <option value="hourly">Last 12 Hours</option>
        <option value="daily">Last 7 Days</option>
      </select>
    </div>
    <canvas id="tempChart"></canvas>
  </section>
</main>

<script>
class PremiumWeather {
  constructor() {
    this.chart = null;
    this.lastUpdate = 0;
    this.init();
  }

  init() {
    this.updateClock();
    this.fetchData();
    this.loadChart();
    setInterval(() => this.updateClock(), 1000);
    setInterval(() => this.fetchData(), 8000);
    setInterval(() => this.loadChart(), 120000);
  }

  update(el, value) {
    if (el.textContent === value) return;
    el.style.transition = 'opacity 0.4s cubic-bezier(0.23,1,0.32,1)';
    el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = value;
      el.style.opacity = 1;
    }, 200);
  }

  createRain(intensity = 120) {
    const rain = document.getElementById('rain');
    rain.innerHTML = '';
    for (let i = 0; i < intensity; i++) {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = `${Math.random() * 100}vw`;
      drop.style.animationDuration = `${0.6 + Math.random() * 0.6}s`;
      drop.style.animationDelay = `${Math.random() * 2}s`;
      drop.style.opacity = 0.4 + Math.random() * 0.4;
      rain.appendChild(drop);
    }
  }

  clearRain() {
    document.getElementById('rain').innerHTML = '';
  }

  async fetchData() {
    try {
      const res = await fetch('/api/latest');
      if (!res.ok) throw new Error();
      
      const data = await res.json();
      this.lastUpdate = Date.now();

      // Main data
      this.update(document.getElementById('temp'), data.temperature?.toFixed(1) + '°C' || '--');
      this.update(document.getElementById('hum'), data.humidity?.toFixed(0) + '%' || '--');
      this.update(document.getElementById('windSpeed'), data.wind_speed?.toFixed(1) + ' km/h' || '--');
      this.update(document.getElementById('visibility'), data.visibility?.toFixed(0) + '%' || '--');

      // Rain
      const rainStatus = (data.rain || '').toLowerCase();
      const rainText = rainStatus.includes('rain') ? 'Rainy ☔' : 'Clear';
      this.update(document.getElementById('rain'), rainText);

      // Status
      document.getElementById('status').innerHTML = 
        data.device_status === 'Online' ? '🟢 Live Data' : '🔴 Offline';

      // Sky & effects
      const sky = document.getElementById('sky');
      if (rainStatus.includes('rain')) {
        sky.className = 'sky-rain';
        this.createRain(150);
      } else {
        sky.className = 'sky-clear';
        this.clearRain();
      }

      // Fog
      document.getElementById('fog').style.opacity = data.visibility < 40 ? 0.7 : 0;

      // Lightning
      if (data.alert?.includes('Storm')) {
        document.getElementById('lightning').style.opacity = 1;
        setTimeout(() => {
          document.getElementById('lightning').style.opacity = 0;
        }, 250);
      }

      // Stats
      this.update(document.getElementById('minTemp'), data.min_temp?.toFixed(1) + '°C' || '--');
      this.update(document.getElementById('maxTemp'), data.max_temp?.toFixed(1) + '°C' || '--');
      this.update(document.getElementById('avgTemp'), data.avg_temp?.toFixed(1) + '°C' || '--');

      // Trend
      document.getElementById('trend').textContent = 
        data.trend === 'Rising' ? '📈 Rising' :
        data.trend === 'Falling' ? '📉 Falling' : '➖ Stable';

      // Alerts
      const alertBox = document.getElementById('alertBox');
      if (data.alert && data.alert !== 'Normal') {
        alertBox.style.display = 'block';
        alertBox.className = `alert ${data.alert.includes('Storm') || data.alert.includes('Heat') ? 'alert-danger' : 'alert-warning'}`;
        alertBox.textContent = data.alert;
        setTimeout(() => alertBox.style.display = 'none', 8000);
      }

      document.getElementById('loadingText').style.display = 'none';

    } catch (e) {
      console.error(e);
      document.getElementById('status').innerHTML = '❌ Connection Error';
    }
  }

  async loadChart() {
    try {
      const mode = document.getElementById('chartMode').value;
      const res = await fetch(`/api/history?mode=${mode}`);
      const data = await res.json();

      if (this.chart) this.chart.destroy();

      const ctx = document.getElementById('tempChart').getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, 'rgba(116,185,255,0.8)');
      gradient.addColorStop(1, 'rgba(116,185,255,0.1)');

      this.chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => new Date(d.time).toLocaleString([], { 
            hour: 'numeric', 
            minute: '2-digit',
            hour12: true 
          })),
          datasets: [{
            data: data.map(d => d.temperature),
            borderColor: '#3b82f6',
            backgroundColor: gradient,
            borderWidth: 4,
            fill: true,
            tension: 0.45,
            pointRadius: 6,
            pointHoverRadius: 10,
            pointBackgroundColor: 'white',
            pointBorderColor: '#3b82f6',
            pointBorderWidth: 3,
            spanGaps: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(10,10,15,0.95)',
              titleColor: 'white',
              bodyColor: 'rgba(255,255,255,0.9)',
              cornerRadius: 12,
              padding: 16
            }
          },
          scales: {
            x: { 
              grid: { color: 'rgba(255,255,255,0.08)' },
              ticks: { color: var(--text-secondary) }
            },
            y: { 
              grid: { color: 'rgba(255,255,255,0.08)' },
              ticks: { color: var(--text-secondary) }
            }
          },
          interaction: {
            intersect: false,
            mode: 'index'
          }
        }
      });

      document.getElementById('dateLabel').textContent = 
        `📊 ${new Date().toLocaleDateString('en-US', { 
          weekday: 'short', 
          month: 'short', 
          day: 'numeric' 
        })}`;

    } catch (e) {
      console.error('Chart error:', e);
    }
  }

  updateClock() {
    const now = new Date();
    document.getElementById('liveClock').textContent = 
      now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    if (this.lastUpdate) {
      const diff = Math.floor((Date.now() - this.lastUpdate) / 1000);
      document.getElementById('updateTime').textContent = `Updated ${diff}s ago`;
    }
  }
}

// Initialize Premium Weather App
new PremiumWeather();
</script>
</body>
</html>
