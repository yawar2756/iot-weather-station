<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="description" content="Live IoT weather dashboard showing real-time temperature, humidity, wind speed and rainfall data.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Weather Dashboard | IoT Weather Station</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
overflow-x:hidden;
animation: fadePage 0.6s ease;
}

@keyframes fadePage{from{opacity:0}to{opacity:1}}

.header{
background:rgba(0,0,0,0.4);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.header h1{margin:0;font-size:22px}

.export-btn{
background:#28a745;
padding:8px 14px;
border-radius:6px;
color:white;
text-decoration:none;
font-size:13px;
}

.container{width:100%;padding:20px;box-sizing:border-box;}

.hero{text-align:center;margin-bottom:30px}

.temperature{
font-size:72px;
font-weight:700;
background: linear-gradient(90deg,#00e5ff,#00ffcc);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.trend{font-size:18px;margin-top:5px}
.status{margin-top:10px;font-weight:bold}
.update-time{margin-top:6px;font-size:13px;opacity:0.7}

.grid{display:grid;gap:20px}

.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:30px;}
.analytics-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:30px;}

.card{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
padding:20px;
border-radius:18px;
text-align:center;
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 25px rgba(0,0,0,0.3);
transition:0.3s;
}

.card:hover{
transform: translateY(-5px);
box-shadow:0 12px 35px rgba(0,0,0,0.5);
}

.chart-section{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
height:320px;
}

canvas{
width:100%!important;
height:100%!important;
}

.alert{
display:none;
margin-top:15px;
padding:16px;
border-radius:14px;
font-weight:bold;
backdrop-filter: blur(10px);
animation: fadeIn 0.4s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(-10px);}
to{opacity:1;transform:translateY(0);}
}

.alert-danger{
background: rgba(255,0,0,0.25);
border:1px solid rgba(255,0,0,0.4);
}

.alert-warning{
background: rgba(255,165,0,0.25);
border:1px solid rgba(255,165,0,0.4);
}

@media(max-width:768px){
.temperature{font-size:46px}
.kpi-grid,.analytics-grid{grid-template-columns:1fr}
.chart-section{height:260px}
}
</style>

</head>

<body>

<div class="header">
<div>
<h1>GPCA Smart Weather System</h1>
<span>Cloud Monitoring Dashboard • v1.0.0</span>
</div>
<a href="/api/export" class="export-btn">⬇ Export Last 7 Days</a>
</div>

<div class="container">

<div class="hero">
<div class="temperature" id="temp">-- °C</div>
<div class="trend" id="trend">➖ Stable</div>
<div id="deviceStatus" class="status">⏳ Loading data...</div>
<div class="update-time" id="updateTime">Updated --</div>
<br>
<div id="liveClock"></div>
<div id="alertBox" class="alert"></div>
</div>

<div class="grid kpi-grid">
<div class="card"><h3>Humidity</h3><p id="hum">-- %</p></div>
<div class="card"><h3>Wind Speed</h3><p id="windSpeed">-- km/h</p></div>
<div class="card"><h3>Visibility</h3><p id="visibility">-- %</p></div>
<div class="card"><h3>Rain Status</h3><p id="rain">--</p></div>
</div>

<div class="grid analytics-grid">
<div class="card"><h3>Min Temperature</h3><p id="minTemp">-- °C</p></div>
<div class="card"><h3>Max Temperature</h3><p id="maxTemp">-- °C</p></div>
<div class="card"><h3>Average Temperature</h3><p id="avgTemp">-- °C</p></div>
</div>

<div class="chart-section">
<label id="dateLabel">📅 Loading...</label>
<select id="chartMode" onchange="loadChart()">
<option value="hourly">Last 12 Hours</option>
<option value="daily">Last 7 Days</option>
</select>
<canvas id="tempChart"></canvas>
</div>

</div>

<script>

let chart=null;
let lastUpdateTime=null;
let clockTimer=null;

/* smooth update (safe) */
function smoothUpdate(id,value){
const el=document.getElementById(id);
if(!el)return;
if(el.innerText===value)return;

el.style.transition="opacity 0.2s ease";  // ADD THIS
el.style.opacity=0;

setTimeout(()=>{
  el.innerText=value;
  el.style.opacity=1;
},200);
}

/* counter */
function updateCounter(){
if(!lastUpdateTime)return;
const sec=Math.floor((Date.now()-lastUpdateTime)/1000);
document.getElementById("updateTime").innerText="Updated "+sec+"s ago";
}
setInterval(updateCounter,1000);

/* fetch */
async function fetchData(){
try{
const res=await fetch("/api/latest");

if(!res.ok){
document.getElementById("deviceStatus").innerText="🔴 Offline";
return;
}

const data=await res.json();

if(data.message){
document.getElementById("deviceStatus").innerText="⚠ No Data Yet";
return;
}

document.getElementById("deviceStatus").innerText =
data.device_status==="Online"?"🟢 Device Online":"🔴 Offline";

lastUpdateTime=Date.now();

smoothUpdate("temp",data.temperature!=null?Number(data.temperature).toFixed(1)+" °C":"-- °C");
smoothUpdate("hum",data.humidity!=null?Number(data.humidity).toFixed(0)+" %":"-- %");
smoothUpdate("windSpeed",data.wind_speed!=null?Number(data.wind_speed).toFixed(1)+" km/h":"-- km/h");

smoothUpdate("visibility",
data.visibility_status==="Not Connected"
?"Not Connected"
:(data.visibility!=null?Number(data.visibility).toFixed(0)+" %":"-- %"));

smoothUpdate("rain",data.rain??"--");
smoothUpdate("minTemp",data.min_temp!=null?Number(data.min_temp).toFixed(1)+" °C":"-- °C");
smoothUpdate("maxTemp",data.max_temp!=null?Number(data.max_temp).toFixed(1)+" °C":"-- °C");
smoothUpdate("avgTemp",data.avg_temp!=null?Number(data.avg_temp).toFixed(1)+" °C":"-- °C");

document.getElementById("trend").innerText=
data.trend==="Rising"?"📈 Rising":
data.trend==="Falling"?"📉 Falling":"➖ Stable";

const alertBox=document.getElementById("alertBox");

if(data.alert && data.alert!=="Normal"){
alertBox.style.display="block";
alertBox.className="alert "+(data.alert.includes("Storm")||data.alert.includes("Heat")?"alert-danger":"alert-warning");
alertBox.innerText="⚠ "+data.alert;
}else{
alertBox.style.display="none";
}

}catch(e){
console.log("fetch error:",e);
document.getElementById("deviceStatus").innerText="🔴 Offline";
}
}

/* chart */
async function loadChart(){
try{
const mode=document.getElementById("chartMode").value;

const res=await fetch("/api/history?mode="+mode);
if(!res.ok)return;

let data=await res.json();
if(!data)data=[];

const temps=data.map(d=>d.temperature??0);
if(temps.length===0)temps.push(0);

const times=(data.length?data:[{time:new Date()}]).map(d=>{
const date=new Date(d.time);
return mode==="hourly"
?date.getHours().toString().padStart(2,'0')+":00"
:date.toLocaleDateString();
});

const ctx=document.getElementById("tempChart").getContext("2d");

if(chart)chart.destroy();

const gradient=ctx.createLinearGradient(0,0,0,300);
gradient.addColorStop(0,"rgba(0,229,255,0.45)");
gradient.addColorStop(1,"rgba(0,229,255,0.02)");

chart=new Chart(ctx,{
type:"line",
data:{
labels:times,
datasets:[{
label:"Temperature (°C)",
data:temps,
borderColor:"#00e5ff",
backgroundColor:gradient,
fill:true,
tension:0.4,
pointRadius:2,
borderWidth:3
}]
},
options:{
responsive:true,
maintainAspectRatio:false
}
});

}catch(e){
console.log("chart error:",e);
}
}

/* clock */
function liveClock(){
document.getElementById("liveClock").innerText="🕒 "+new Date().toLocaleTimeString();
}

function updateDate(){
const now=new Date();
document.getElementById("dateLabel").innerText="📅 "+now.toLocaleDateString();
}

function startClock(){
liveClock();
if(clockTimer)clearInterval(clockTimer);
clockTimer=setInterval(liveClock,1000);
}

window.addEventListener("load",()=>{
fetchData();
loadChart();
startClock();
updateDate();
});

setInterval(()=>{if(!document.hidden)fetchData();},10000);
setInterval(()=>{if(!document.hidden)loadChart();},15000);

</script>

</body>
</html>
